<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy: a strict <meta> policy is injected here by the
      "openbroker-security-headers" plugin in vite.config.ts for PRODUCTION
      builds only (dev needs inline scripts + HMR websocket). Source of truth:
      src/hyperliquid/compliance/csp.ts. frame-ancestors can only be sent as an
      HTTP header: see public/_headers and docs/deploy/.
    -->
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Self-hosted fonts: preload the two primary subsets so first paint
         doesn't wait on the stylesheet round-trip. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="TV.2 — a personal TradingView-grade terminal: advanced charting, drawing tools, watchlist, bar replay and live crypto data."
    />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TV.2" />
    <meta property="og:title" content="TV.2" />
    <meta
      property="og:description"
      content="Open-source trading terminal — advanced charts, drawing tools, and paper trading."
    />
    <meta property="og:type" content="website" />
    <title>TV.2 — Personal Trading Terminal</title>
  </head>
  <body>
    <noscript>TV.2 needs JavaScript to run. It is a non-custodial trading interface and cannot work without it.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
